[package]
name = "pyrite"
version = "0.2.0"
edition = "2024"
authors = ["Ayush Chothe <cto@pyrite.cloud>"]

description = "Pyrite Cloud CLI"
homepage = "https://github.com/PyriteCloud/cli"
repository = "https://github.com/PyriteCloud/cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
cliclack = { version = "0.5.6" }
console = "0.16.6"
handlebars = "6.4.4"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
supabase-auth = "0.10.14"
tonic = { version = "0.14.6", features = ["tls-ring", "tls-native-roots"] }
rust_dotenv = "0.1.3"
base64 = "0.23.1"
pyrite-client-rs = { path = "./client-rs" }
comfy-table = { version = "7.2.2", features = ["custom_styling"] }
chrono = "0.4.45"
pbjson-types = "0.9.0"
axum = "0.8.9"
axum-server = "0.8.0"
oauth2 = "5.0.0"
toml = "0.9.11"
dirs = "7.0.0"
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
